[project]
name = "mrt-caller"
version = "0.1.0"
description = "MRT Tha Phra arrival notifier"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pytz>=2026.3.post1",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
